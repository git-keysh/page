<!-- layouts/3-layout.html -->
<div class="layout-vivid">
  <style>
    .layout-vivid {
      padding: 18px 14px 30px;
      max-width: 1400px;
      margin: 0 auto;
      animation: vividPop 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes vividPop {
      0% { opacity: 0; transform: scale(0.96) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .masonry-grid {
      column-count: 2;
      column-gap: 16px;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 18px;
      background: #fefcf9;
      border-radius: 32px;
      padding: 14px 12px 18px;
      box-shadow: 0 12px 28px -10px rgba(0,0,0,0.12);
      transition: all 0.25s ease;
      border: 1px solid #ede6df;
      transform: translateY(0);
    }
    .masonry-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 35px -12px #1e1e2f33;
    }
    .masonry-item img {
      width: 100%;
      border-radius: 26px;
      background: #d6cdc2;
      transition: transform 0.4s;
      will-change: transform;
      display: block;
    }
    .masonry-item:hover img {
      transform: scale(1.01);
    }
    .masonry-item h4 {
      margin: 14px 0 4px;
      font-weight: 700;
      font-size: 1.4rem;
      color: #1e1e2f;
    }
    .masonry-item p {
      font-weight: 500;
      color: #4a4458;
    }
    .vivid-header {
      margin-bottom: 26px;
    }
    .vivid-header h2 {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(145deg, #b2562a, #1f1f3a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @media (min-width: 640px) {
      .masonry-grid {
        column-count: 3;
      }
    }
  </style>
  <div class="vivid-header">
    <h2>VIVID FLOW · ART SERIES</h2>
    <p style="font-weight: 500;">masonry · limited drops</p>
  </div>
  <div class="masonry-grid">
    <div class="masonry-item">
      <img src="https://printify.com/wp-content/uploads/2023/10/Unisex-Garment-Dyed-T-Shirt-with-design.jpg" alt="Garment dyed">
      <h4>DESERT DYE</h4>
      <p>$36 · pigment</p>
    </div>
    <div class="masonry-item">
      <img src="https://lovecraftgift.com/cdn/shop/files/Casual_ethnic_print_t-shirt.jpg?v=1747388882&width=1200" alt="Ethnic">
      <h4>TRIBAL SPIRIT</h4>
      <p>$42 · waterbased</p>
    </div>
    <div class="masonry-item">
      <img src="https://ucsdguardian.org/wp-content/uploads/2025/05/Michael-Ho-Charlie-Kirk1-1200x800.jpg" alt="Lifestyle">
      <h4>STREET CULT</h4>
      <p>$48 · oversized</p>
    </div>
    <div class="masonry-item">
      <img src="https://gogirgit.com/cdn/shop/files/print-on-back-couple-tshirts_1800x.jpg?v=1704220929" alt="Back print">
      <h4>DUO REAR</h4>
      <p>$52 · puff</p>
    </div>
    <div class="masonry-item">
      <img src="https://d1x3eomzsc6lfz.cloudfront.net/apprintab/images/contentimages/images/personalised-T-shirt-printing.jpg?v=5634" alt="Personalised">
      <h4>MONOGRAM</h4>
      <p>$45 · embroidery</p>
    </div>
    <div class="masonry-item">
      <img src="https://printify.com/wp-content/uploads/2025/04/Gildan-5000-unisex-heavy-cotton-tee-1024x1024.png" alt="Gildan">
      <h4>HEAVYWEIGHT</h4>
      <p>$30 · classic</p>
    </div>
  </div>
</div>
