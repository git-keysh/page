<!-- layouts/1-layout.html -->
<div class="layout-urban">
  <style>
    .layout-urban {
      padding: 20px 16px 30px;
      max-width: 1300px;
      margin: 0 auto;
      animation: urbanFade 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes urbanFade {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
    .urban-hero {
      background: linear-gradient(145deg, #1e1e2f 0%, #2f2a36 100%);
      border-radius: 48px;
      padding: 32px 24px;
      margin-bottom: 32px;
      color: white;
      box-shadow: 0 25px 35px -10px rgba(0,0,0,0.3);
      animation: heroGlow 1.2s infinite alternate;
    }
    @keyframes heroGlow {
      0% { box-shadow: 0 25px 35px -10px #1e1e2f66; }
      100% { box-shadow: 0 30px 45px -5px #b2562a33; }
    }
    .hero-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .hero-action {
      margin-top: 20px;
      display: inline-block;
      background: #ffd966;
      color: #1e1e2f;
      padding: 16px 32px;
      border-radius: 60px;
      font-weight: 800;
      border: none;
      font-size: 1.2rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .hero-action:active { transform: scale(0.96); }
    .urban-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 18px;
    }
    .urban-card {
      background: #ffffffdd;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 14px 10px 20px;
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15);
      transition: all 0.25s ease;
      border: 1px solid rgba(255,255,255,0.5);
      transform: translateY(0);
      display: flex;
      flex-direction: column;
    }
    .urban-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 25px 40px -12px #1e1e2f33;
    }
    .urban-card img {
      width: 100%;
      aspect-ratio: 1/1.1;
      object-fit: cover;
      border-radius: 24px;
      background: #d9d2c5;
      transition: transform 0.4s;
    }
    .urban-card:hover img { transform: scale(1.02); }
    .urban-card h4 {
      margin-top: 12px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #1f1f2e;
    }
    .urban-card p { color: #4e4e62; font-weight: 500; margin-bottom: 12px; }
    .order-btn {
      background: #1e1e2f;
      border: none;
      color: white;
      padding: 12px 10px;
      border-radius: 40px;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #ffffff30;
      box-shadow: 0 6px 12px #0000001a;
    }
    .order-btn:active { background: #2f2f44; transform: scale(0.97); }
    .featured-badge {
      background: #b2562a;
      color: white;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      align-self: flex-start;
      margin-bottom: 6px;
    }
  </style>
  <div class="urban-hero">
    <div class="hero-title">DROP THE<br>BASIC.</div>
    <p style="font-size:1.2rem; margin:12px 0;">Heavyweight prints · limited run</p>
    <button class="hero-action order-now-btn">ORDER CUSTOM →</button>
  </div>
  <div class="urban-header">
    <h2 style="font-size:2.2rem; font-weight:800;">FRESH PRINTS</h2>
  </div>
  <div class="urban-grid">
    <div class="urban-card">
      <span class="featured-badge">BESTSELLER</span>
      <img src="https://printify.com/wp-content/uploads/2023/10/Unisex-Garment-Dyed-T-Shirt-with-design.jpg" alt="Garment dyed">
      <h4>GARMENT DYE</h4>
      <p>$34 · pigment print</p>
      <button class="order-btn">ORDER NOW</button>
    </div>
    <div class="urban-card">
      <img src="https://liondtf.com/cdn/shop/files/Heather-Grey-T-Shirt.jpg?v=1698021997" alt="Heather lion">
      <h4>HEATHER LION</h4>
      <p>$38 · DTF glow</p>
      <button class="order-btn">ORDER NOW</button>
    </div>
    <div class="urban-card">
      <img src="https://d1x3eomzsc6lfz.cloudfront.net/apprintab/images/contentimages/images/personalised-T-shirt-printing.jpg?v=5634" alt="Personalised">
      <h4>CUSTOM SCRIPT</h4>
      <p>$42 · puff ink</p>
      <button class="order-btn">ORDER NOW</button>
    </div>
    <div class="urban-card">
      <img src="https://gogirgit.com/cdn/shop/files/print-on-back-couple-tshirts_1800x.jpg?v=1704220929" alt="Couple back">
      <h4>DUO BACKPRINT</h4>
      <p>$48 · oversized</p>
      <button class="order-btn">ORDER NOW</button>
    </div>
    <div class="urban-card">
      <img src="https://printify.com/wp-content/uploads/2025/04/Gildan-5000-unisex-heavy-cotton-tee-1024x1024.png" alt="Gildan">
      <h4>GILDAN 5000</h4>
      <p>$29 · classic</p>
      <button class="order-btn">ORDER NOW</button>
    </div>
    <div class="urban-card">
      <img src="https://ucsdguardian.org/wp-content/uploads/2025/05/Michael-Ho-Charlie-Kirk1-1200x800.jpg" alt="Statement">
      <h4>STATEMENT TEE</h4>
      <p>$45 · photo real</p>
      <button class="order-btn">ORDER NOW</button>
    </div>
  </div>
  <div style="margin-top:40px; text-align:center;">
    <button class="hero-action" style="background:white; color:#1e1e2f; border:1px solid #ccc;" id="quickOrderAll">QUICK ORDER 3 FOR $99</button>
  </div>
  <script>
    (function attachExtra(){
      const btn = document.getElementById('quickOrderAll');
      if(btn) btn.addEventListener('click', ()=>{
        if(window.MateoDemo) window.MateoDemo.addToCart('🔥 Urban Bundle (3 tees)');
      });
    })();
  </script>
</div>
