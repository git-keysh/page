<!-- layouts/1-layout.html -->
<div class="layout-urban">
  <style>
    .layout-urban { padding: 20px 16px 30px; max-width: 1300px; margin: 0 auto; animation: urbanFade 0.5s; }
    @keyframes urbanFade { 0% { opacity: 0; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }
    .urban-hero { background: linear-gradient(145deg, #1e1e2f 0%, #2f2a36 100%); border-radius: 48px; padding: 32px 24px; margin-bottom: 32px; color: white; box-shadow: 0 25px 35px -10px rgba(0,0,0,0.3); }
    .hero-title { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.03em; }
    .hero-action { margin-top: 20px; display: inline-block; background: #ffd966; color: #1e1e2f; padding: 16px 32px; border-radius: 60px; font-weight: 800; border: none; font-size: 1.2rem; cursor: pointer; }
    .urban-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; }
    .urban-card { background: #ffffffdd; backdrop-filter: blur(8px); border-radius: 32px; padding: 14px 10px 20px; box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15); transition: all 0.25s; border: 1px solid rgba(255,255,255,0.5); display: flex; flex-direction: column; }
    .urban-card:hover { transform: translateY(-8px); }
    .urban-card img { width: 100%; aspect-ratio: 1/1.1; object-fit: cover; border-radius: 24px; }
    .urban-card h4 { margin-top: 12px; font-weight: 700; font-size: 1.2rem; }
    .order-btn { background: #1e1e2f; border: none; color: white; padding: 12px 10px; border-radius: 40px; font-weight: 700; margin-top: 8px; cursor: pointer; }
  </style>
  <div class="urban-hero">
    <div class="hero-title">DROP THE<br>BASIC.</div>
    <p style="font-size:1.2rem; margin:12px 0;">Heavyweight prints · limited run</p>
    <button class="hero-action order-now-btn">ORDER CUSTOM →</button>
  </div>
  <div class="urban-grid">
    <div class="urban-card"><img src="https://printify.com/wp-content/uploads/2023/10/Unisex-Garment-Dyed-T-Shirt-with-design.jpg"><h4>GARMENT DYE</h4><p>$34 · pigment</p><button class="order-btn">ORDER NOW</button></div>
    <div class="urban-card"><img src="https://liondtf.com/cdn/shop/files/Heather-Grey-T-Shirt.jpg?v=1698021997"><h4>HEATHER LION</h4><p>$38 · DTF</p><button class="order-btn">ORDER NOW</button></div>
    <div class="urban-card"><img src="https://d1x3eomzsc6lfz.cloudfront.net/apprintab/images/contentimages/images/personalised-T-shirt-printing.jpg?v=5634"><h4>CUSTOM SCRIPT</h4><p>$42 · puff</p><button class="order-btn">ORDER NOW</button></div>
    <div class="urban-card"><img src="https://gogirgit.com/cdn/shop/files/print-on-back-couple-tshirts_1800x.jpg?v=1704220929"><h4>DUO BACK</h4><p>$48 · oversized</p><button class="order-btn">ORDER NOW</button></div>
    <div class="urban-card"><img src="https://printify.com/wp-content/uploads/2025/04/Gildan-5000-unisex-heavy-cotton-tee-1024x1024.png"><h4>GILDAN 5000</h4><p>$29 · classic</p><button class="order-btn">ORDER NOW</button></div>
    <div class="urban-card"><img src="https://ucsdguardian.org/wp-content/uploads/2025/05/Michael-Ho-Charlie-Kirk1-1200x800.jpg"><h4>STATEMENT</h4><p>$45 · photo</p><button class="order-btn">ORDER NOW</button></div>
  </div>
</div>
