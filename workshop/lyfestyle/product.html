<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="description" content="Detailed information and specifications about our audio products. Learn more and make your choice.">
    <meta name="keywords" content="audio product details, specifications, speakers, amplifiers">
    <title>Product Details | Simplicity Creations</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brand-logo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #050505;
            --bg-secondary: #0a0a0f;
            --bg-card: #0f0f15;
            --accent-blue: #8a2be2;
            --accent-soft: rgba(138, 43, 226, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-dim: rgba(255, 255, 255, 0.5);
            --text-main: #ffffff;
            --border-color: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-black); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6; 
            overflow-x: hidden; 
            transition: background-color 0.3s, color 0.3s; 
            min-height: 100vh;
        }

        /* --- NAVIGATION --- */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 5%; 
            height: 72px; 
            background: rgba(5, 5, 5, 0.92); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--glass-border); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
        }
        .logo-container { display: flex; align-items: center; }
        .nav-logo { height: 38px; width: auto; display: block; }
        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 6px; 
            align-items: center; 
        }
        nav ul li a { 
            color: var(--text-dim); 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.7rem; 
            letter-spacing: 0.08em; 
            text-transform: uppercase; 
            padding: 8px 14px; 
            border-radius: 8px; 
            transition: 0.2s; 
        }
        nav ul li a:hover, nav ul li a.active { 
            color: var(--accent-blue); 
            background: var(--accent-soft); 
        }
        nav ul li a.cart-icon-only { padding: 8px 12px; font-size: 1rem; }
        #mode-toggle, #mode-toggle-mobile { display: none !important; }

        .hamburger-menu { 
            display: none; 
            flex-direction: column; 
            gap: 5px; 
            background: none; 
            border: none; 
            cursor: pointer; 
            padding: 4px; 
        }
        .hamburger-menu span { 
            width: 24px; 
            height: 2px; 
            background: var(--text-main); 
            border-radius: 2px; 
            transition: 0.3s; 
        }

        .nav-dropdown { 
            display: none; 
            flex-direction: column; 
            width: 100%; 
            padding: 16px 20px; 
            gap: 4px; 
            background: rgba(5, 5, 5, 0.98); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--glass-border); 
        }
        .nav-dropdown a, .nav-dropdown button { 
            color: var(--text-dim); 
            text-decoration: none; 
            padding: 10px 14px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            background: none; 
            border: none; 
            text-align: left; 
            border-radius: 8px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .nav-dropdown a:hover, .nav-dropdown a.active { 
            background: var(--accent-soft); 
            color: var(--accent-blue); 
        }
        .nav-dropdown.active { display: flex; }

        @media (max-width: 820px) {
            nav ul { display: none; }
            .hamburger-menu { display: flex; }
            .nav-dropdown { display: none; }
            .nav-dropdown.active { display: flex; }
            nav { padding: 0 16px; height: 64px; }
        }

        /* --- PRODUCT LAYOUT --- */
        .container { 
            max-width: 1200px; 
            margin: 100px auto 40px; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 50px; 
            align-items: flex-start; 
        }

        /* GALLERY */
        .gallery-container { display: flex; flex-direction: column; gap: 16px; }

        .product-image-section { 
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border); 
            border-radius: var(--radius); 
            padding: 30px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 500px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .product-image-section:hover {
            border-color: var(--accent-blue);
        }
        .product-image-section img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
            max-height: 440px;
        }

        .thumb-row { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 4px 0; 
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .thumb-row::-webkit-scrollbar { display: none; }
        .thumb { 
            width: 80px; 
            height: 80px; 
            flex: 0 0 80px;
            border: 1px solid var(--glass-border); 
            border-radius: 12px; 
            cursor: pointer; 
            background: var(--bg-secondary); 
            padding: 10px; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumb.active { border-color: var(--accent-blue); background: var(--accent-soft); }
        .thumb img { width: 100%; height: 100%; object-fit: contain; }

        /* PRODUCT INFO */
        .brand-tag { 
            color: var(--accent-blue); 
            font-weight: 900; 
            letter-spacing: 1.5px; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            display: inline-block; 
            margin-bottom: 8px; 
        }
        .product-title { 
            font-size: 2.8rem; 
            font-weight: 900; 
            margin-bottom: 8px; 
            line-height: 1.1; 
            text-transform: uppercase; 
            letter-spacing: -0.02em;
        }
        .price { 
            font-size: 2rem; 
            margin-bottom: 20px; 
            font-weight: 700; 
            color: var(--accent-blue);
        }

        .specs-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
            margin-bottom: 30px; 
        }
        .spec-item { 
            border-left: 3px solid var(--accent-blue); 
            padding-left: 14px; 
        }
        .spec-label { 
            display: block; 
            font-size: 0.6rem; 
            color: var(--text-dim); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .spec-value { 
            font-size: 1rem; 
            font-weight: 700; 
            color: var(--text-main);
        }

        /* ACTION AREA - BIG BUTTON */
        .action-area { 
            display: flex; 
            gap: 16px; 
            margin-top: 20px; 
            align-items: center; 
            flex-wrap: wrap;
            width: 100%;
        }
        .qty-controls { 
            display: flex; 
            align-items: center; 
            background: var(--bg-secondary); 
            border: 1px solid var(--glass-border); 
            border-radius: 14px; 
            height: 80px; 
            width: 180px; 
            flex-shrink: 0;
        }
        .qty-btn { 
            background: transparent; 
            border: none; 
            color: var(--text-main); 
            width: 56px; 
            height: 100%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 1.8rem;
            transition: background 0.2s;
            border-radius: 14px;
        }
        .qty-btn:hover { background: var(--accent-soft); }
        .qty-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: var(--text-main); 
            font-size: 1.8rem; 
            font-weight: 800; 
            text-align: center; 
            outline: none;
            appearance: textfield;
            -moz-appearance: textfield;
            min-width: 50px;
            font-family: 'Inter', sans-serif;
        }
        .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* BIG ADD TO CART BUTTON */
        .add-btn { 
            flex: 1;
            min-width: 280px;
            height: 80px; 
            background: var(--accent-blue); 
            color: #fff; 
            border: none; 
            border-radius: 16px; 
            font-weight: 800; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            letter-spacing: 2px; 
            font-size: 1.35rem; 
            padding: 0 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            box-shadow: 0 4px 24px rgba(138, 43, 226, 0.35);
            position: relative;
            overflow: hidden;
        }
        .add-btn i {
            font-size: 1.6rem;
        }
        .add-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .add-btn:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 8px 48px rgba(138, 43, 226, 0.55);
            background: #9b4df0;
        }
        .add-btn:hover::after {
            opacity: 1;
        }
        .add-btn:active {
            transform: scale(0.97);
        }

        /* DESCRIPTION AREA */
        .full-description-area { 
            max-width: 1200px; 
            margin: 0 auto 40px; 
            padding: 40px 20px; 
            border-top: 1px solid var(--glass-border); 
        }
        .section-title { 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 20px; 
            color: var(--accent-blue); 
        }
        .desc-text { 
            color: var(--text-dim); 
            font-size: 1rem; 
            line-height: 1.8; 
            max-width: 900px; 
        }

        /* RELATED PRODUCTS */
        .related-products {
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .related-products .section-title {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .related-product-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .related-product-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(138, 43, 226, 0.15);
        }
        .rpc-image {
            height: 160px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-decoration: none;
        }
        .rpc-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .rpc-content {
            padding: 14px 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .rpc-brand {
            font-size: 0.6rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }
        .rpc-name {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 600;
            margin: 4px 0 8px;
            line-height: 1.3;
            flex: 1;
            text-decoration: none;
        }
        .rpc-name:hover { color: var(--accent-blue); }
        .rpc-price {
            font-size: 1rem;
            color: var(--accent-blue);
            font-weight: 800;
            margin-bottom: 10px;
        }
        .rpc-actions {
            display: flex;
            gap: 8px;
        }
        .rpc-actions button {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .rpc-actions .cart-btn {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: #fff;
        }
        .rpc-actions .cart-btn:hover {
            background: transparent;
            color: var(--accent-blue);
        }

        /* FOOTER */
        footer { 
            padding: 40px 5% 30px; 
            background: var(--bg-secondary); 
            border-top: 1px solid var(--glass-border); 
            text-align: center; 
        }
        .footer-content { max-width: 1200px; margin: 0 auto; }
        .footer-contacts { 
            color: var(--text-dim); 
            font-size: 0.75rem; 
            margin: 12px 0; 
        }
        .footer-contacts a { 
            color: var(--text-dim); 
            text-decoration: none; 
            transition: 0.2s; 
        }
        .footer-contacts a:hover { color: var(--accent-blue); }
        .social-icons { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin: 16px 0; 
        }
        .social-icons a { 
            color: var(--text-dim); 
            font-size: 1.2rem; 
            transition: 0.2s; 
        }
        .social-icons a:hover { 
            color: var(--accent-blue); 
            transform: translateY(-2px); 
        }
        .copyright { 
            color: var(--text-dim); 
            opacity: 0.4; 
            font-size: 0.6rem; 
            letter-spacing: 0.5px; 
        }

        /* WHATSAPP */
        .whatsapp-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: #fff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            text-decoration: none;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }
        .whatsapp-button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4);
        }

        /* GALLERY MODAL */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            overflow: hidden;
        }
        .gallery-modal img {
            max-width: 90%;
            max-height: 85%;
            user-select: none;
            -webkit-user-drag: none;
        }
        .gallery-modal .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            padding: 12px 18px;
            user-select: none;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
        }
        .gallery-modal .arrow:hover { opacity: 0.7; background: rgba(0,0,0,0.5); }
        .gallery-modal .arrow.left { left: 16px; }
        .gallery-modal .arrow.right { right: 16px; }
        .gallery-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .gallery-modal .close-btn:hover { opacity: 0.6; }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: var(--accent-blue);
            color: #fff;
            padding: 18px 32px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.3);
        }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; gap: 30px; margin-top: 90px; }
            .product-title { font-size: 2.2rem; }
            .price { font-size: 1.6rem; }
            .specs-grid { grid-template-columns: 1fr 1fr; }
            .related-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .container { margin-top: 80px; padding: 0 16px; gap: 24px; }
            .product-image-section { min-height: 320px; padding: 20px; }
            .product-image-section img { max-height: 280px; }
            .product-title { font-size: 1.8rem; }
            .price { font-size: 1.4rem; }
            .specs-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .spec-value { font-size: 0.9rem; }
            .thumb { width: 64px; height: 64px; flex: 0 0 64px; padding: 8px; }
            
            .action-area { 
                flex-direction: column; 
                width: 100%; 
                gap: 14px; 
            }
            .qty-controls { 
                width: 100%; 
                height: 72px; 
                border-radius: 14px; 
            }
            .qty-btn { 
                width: 64px; 
                font-size: 1.6rem; 
            }
            .qty-input { 
                font-size: 1.6rem; 
                min-width: 50px; 
            }
            .add-btn { 
                width: 100%; 
                height: 78px; 
                font-size: 1.25rem; 
                min-width: unset;
                padding: 0 30px;
                gap: 16px;
                border-radius: 14px;
                letter-spacing: 1.5px;
            }
            .add-btn i { 
                font-size: 1.5rem; 
            }
            
            .related-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .rpc-image { height: 130px; }
            .rpc-name { font-size: 0.8rem; }
            .full-description-area { padding: 30px 16px; }
            .desc-text { font-size: 0.9rem; }
            .gallery-modal .arrow { font-size: 1.8rem; padding: 8px 12px; }
            .gallery-modal .arrow.left { left: 8px; }
            .gallery-modal .arrow.right { right: 8px; }
        }

        @media (max-width: 480px) {
            .container { margin-top: 70px; padding: 0 12px; gap: 16px; }
            .product-image-section { min-height: 220px; padding: 14px; border-radius: 12px; }
            .product-image-section img { max-height: 180px; }
            .product-title { font-size: 1.4rem; }
            .price { font-size: 1.2rem; margin-bottom: 14px; }
            .brand-tag { font-size: 0.6rem; }
            .specs-grid { grid-template-columns: 1fr; gap: 10px; }
            .spec-item { padding-left: 10px; }
            .spec-label { font-size: 0.55rem; }
            .spec-value { font-size: 0.85rem; }
            .thumb { width: 52px; height: 52px; flex: 0 0 52px; padding: 6px; border-radius: 8px; }
            
            .qty-controls { 
                height: 68px; 
                border-radius: 14px;
                width: 100%;
            }
            .qty-btn { 
                width: 60px; 
                font-size: 1.5rem; 
            }
            .qty-input { 
                font-size: 1.5rem; 
                min-width: 44px;
            }
            .add-btn { 
                height: 74px; 
                font-size: 1.2rem; 
                padding: 0 24px;
                gap: 16px;
                border-radius: 14px;
                letter-spacing: 1.5px;
                min-height: 68px;
                width: 100%;
            }
            .add-btn i { 
                font-size: 1.4rem; 
            }
            
            .related-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .rpc-image { height: 100px; padding: 10px; }
            .rpc-content { padding: 10px 12px 12px; }
            .rpc-name { font-size: 0.7rem; }
            .rpc-price { font-size: 0.85rem; }
            .rpc-actions button { font-size: 0.65rem; padding: 8px; }
            .full-description-area { padding: 20px 12px; }
            .section-title { font-size: 0.95rem; margin-bottom: 14px; }
            .desc-text { font-size: 0.85rem; line-height: 1.6; }
            .gallery-modal .arrow { font-size: 1.4rem; padding: 6px 10px; }
            .gallery-modal .close-btn { font-size: 2rem; top: 12px; right: 16px; }
            .whatsapp-button { width: 50px; height: 50px; font-size: 1.5rem; bottom: 20px; right: 20px; }
            .notification { bottom: 80px; right: 16px; font-size: 0.85rem; padding: 14px 20px; }
        }

        /* Extra small devices - EVEN BIGGER BUTTON */
        @media (max-width: 380px) {
            .add-btn { 
                height: 72px; 
                font-size: 1.1rem; 
                padding: 0 18px;
                gap: 14px;
                min-height: 66px;
                letter-spacing: 1.2px;
                border-radius: 14px;
            }
            .add-btn i { 
                font-size: 1.3rem; 
            }
            .qty-controls { height: 62px; }
            .qty-btn { width: 54px; font-size: 1.4rem; }
            .qty-input { font-size: 1.4rem; min-width: 40px; }
            .product-title { font-size: 1.2rem; }
            .thumb { width: 44px; height: 44px; flex: 0 0 44px; padding: 4px; }
        }
    </style>
</head>

    <!-- RELATED PRODUCTS SECTION -->
    <section class="related-products">
        <h2 class="section-title">YOU MIGHT ALSO LIKE</h2>
        <div class="related-grid" id="related-grid"></div>
    </section>

    <!-- GALLERY MODAL -->
    <div id="galleryModal" class="gallery-modal">
        <span class="close-btn" onclick="closeGallery()">&times;</span>
        <span class="arrow left" onclick="prevGallery()">&#10094;</span>
        <img id="galleryModalImg" src="" alt="">
        <span class="arrow right" onclick="nextGallery()">&#10095;</span>
    </div>

    <a href="https://wa.me/18687168237?text=Hello%20Simplicity%20Creations%2C%20I%20need%20help%20with%20a%20product%20inquiry" class="whatsapp-button" target="_blank" title="Chat with us on WhatsApp"><i class="fab fa-whatsapp"></i></a>

    <script>
        let currentProduct = null;
        let galleryImages = [];
        let galleryIndex = 0;
        let activeColorVariants = [];
        let activeColorIndex = 0;

        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                window.location.href = 'shop.html';
                return;
            }

            try {
                const response = await fetch('products.json');
                const products = await response.json();
                currentProduct = products.find(p => String(p.id) === String(productId));

                if (!currentProduct) {
                    document.getElementById('dynamic-content').innerHTML = "<h2 style='text-align:center; padding: 100px 20px;'>Product not found.</h2>";
                    return;
                }
                renderProduct();
                renderRelatedProducts(products);
            } catch (err) { 
                console.error("Error loading products:", err); 
                document.getElementById('dynamic-content').innerHTML = "<h2 style='text-align:center; padding: 100px 20px;'>Error loading data.</h2>";
            }
        }

        function getColorVariants(product) {
            if (!product || !product.color_variants || typeof product.color_variants !== 'object') return [];
            const variants = [];
            for (const [name, data] of Object.entries(product.color_variants)) {
                const images = Array.isArray(data?.images) ? data.images.filter(Boolean) : [];
                variants.push({
                    name,
                    swatch: data?.swatch || '#8a2be2',
                    images: images.length > 0 ? images : (Array.isArray(product.images) ? product.images.slice() : [])
                });
            }
            return variants;
        }

        function getActiveImages() {
            if (activeColorVariants.length > 0) {
                const selected = activeColorVariants[activeColorIndex];
                if (selected && Array.isArray(selected.images) && selected.images.length > 0) {
                    return selected.images.slice();
                }
            }
            return Array.isArray(currentProduct?.images) ? currentProduct.images.slice() : [];
        }

        function renderProduct() {
            activeColorVariants = getColorVariants(currentProduct);
            if (activeColorIndex >= activeColorVariants.length) activeColorIndex = 0;
            const activeImages = getActiveImages();
            if (activeImages.length === 0) {
                document.getElementById('dynamic-content').innerHTML = "<h2 style='text-align:center; padding: 100px 20px;'>No images available.</h2>";
                return;
            }

            let specsHtml = '';
            if(currentProduct.specs) {
                for (const [key, value] of Object.entries(currentProduct.specs)) {
                    specsHtml += `<div class="spec-item"><span class="spec-label">${key}</span><span class="spec-value">${value}</span></div>`;
                }
            }

            const thumbsHtml = activeImages.map((img, idx) => `
                <div class="thumb ${idx === 0 ? 'active' : ''}" onclick="changeImage(${idx})">
                    <img src="${img}" alt="thumb" onerror="this.src='images/placeholder.png'">
                </div>
            `).join('');

            const colorSelectorHtml = activeColorVariants.length > 0 ? `
                <div style="margin-bottom:16px;">
                    <span style="font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;display:block;margin-bottom:8px;">Color</span>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;">
                        ${activeColorVariants.map((variant, idx) => `
                            <button type="button" onclick="selectColorVariant(${idx})" style="
                                display:inline-flex;
                                align-items:center;
                                gap:6px;
                                padding:6px 16px;
                                border:1px solid ${idx === activeColorIndex ? 'var(--accent-blue)' : 'var(--glass-border)'};
                                background:${idx === activeColorIndex ? 'var(--accent-soft)' : 'transparent'};
                                color:var(--text-main);
                                border-radius:999px;
                                font-size:0.7rem;
                                font-weight:700;
                                text-transform:uppercase;
                                cursor:pointer;
                                transition:0.2s;
                                font-family:inherit;
                            ">
                                <span style="width:10px;height:10px;border-radius:50%;background:${variant.swatch};border:1px solid rgba(255,255,255,0.2);display:inline-block;"></span>
                                ${variant.name}
                            </button>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            galleryImages = activeImages.slice();
            galleryIndex = 0;

            document.getElementById('dynamic-content').innerHTML = `
                <main class="container">
                    <section class="gallery-container">
                        <div class="product-image-section" onclick="openGallery(galleryIndex)">
                            <img src="${activeImages[0]}" id="main-img" alt="${currentProduct.name}" onerror="this.src='images/placeholder.png'">
                        </div>
                        <div class="thumb-row">${thumbsHtml}</div>
                    </section>

                    <section class="product-info-section">
                        <span class="brand-tag">${currentProduct.brand}</span>
                        <h1 class="product-title">${currentProduct.name}</h1>
                        <p class="price">$${Number(currentProduct.price).toLocaleString()}</p>
                        ${colorSelectorHtml}
                        <div class="specs-grid">${specsHtml}</div>
                        <div class="action-area">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty(-1)"><i class="fas fa-minus"></i></button>
                                <input type="number" id="buy-qty" class="qty-input" value="1" readonly>
                                <button class="qty-btn" onclick="updateQty(1)"><i class="fas fa-plus"></i></button>
                            </div>
                            <button class="add-btn" onclick="addToCart()">
                                <i class="fas fa-shopping-cart"></i> Add to Shopping Cart
                            </button>
                        </div>
                    </section>
                </main>

                <section class="full-description-area">
                    <h2 class="section-title">Product Description</h2>
                    <p class="desc-text">${currentProduct.description || 'No description available.'}</p>
                </section>
            `;
        }

        function changeImage(idx) {
            if (!galleryImages.length || idx < 0 || idx >= galleryImages.length) return;
            galleryIndex = idx;
            const mainImg = document.getElementById('main-img');
            if (mainImg) mainImg.src = galleryImages[idx];
            document.querySelectorAll('.thumb').forEach((t, i) => {
                t.classList.toggle('active', i === idx);
            });
        }

        function selectColorVariant(index) {
            if (!activeColorVariants.length || index < 0 || index >= activeColorVariants.length) return;
            activeColorIndex = index;
            const activeImages = getActiveImages();
            galleryImages = activeImages.slice();
            galleryIndex = 0;
            
            const mainImg = document.getElementById('main-img');
            if (mainImg && activeImages.length) mainImg.src = activeImages[0];
            
            const thumbsWrap = document.querySelector('.thumb-row');
            if (thumbsWrap) {
                thumbsWrap.innerHTML = activeImages.map((img, idx) => `
                    <div class="thumb ${idx === 0 ? 'active' : ''}" onclick="changeImage(${idx})">
                        <img src="${img}" alt="thumb" onerror="this.src='images/placeholder.png'">
                    </div>
                `).join('');
            }
            
            document.querySelectorAll('.color-option-btn').forEach((btn, idx) => {
                btn.style.borderColor = idx === index ? 'var(--accent-blue)' : 'var(--glass-border)';
                btn.style.background = idx === index ? 'var(--accent-soft)' : 'transparent';
            });
        }

        function updateQty(amt) {
            const input = document.getElementById('buy-qty');
            let val = parseInt(input.value) + amt;
            if (val < 1) val = 1;
            input.value = val;
        }

        function addToCart() {
            if (!currentProduct) {
                showNotification('Error: Product not loaded.');
                return;
            }

            try {
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                const qtyInput = document.getElementById('buy-qty');
                const qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
                const activeImages = getActiveImages();
                
                const productToAdd = {
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: parseFloat(currentProduct.price),
                    brand: currentProduct.brand,
                    image: activeImages[0] || currentProduct.images?.[0] || 'images/placeholder.png',
                    qty: qty
                };
                
                const existing = cart.find(item => String(item.id) === String(productToAdd.id));
                if (existing) {
                    existing.qty += qty;
                } else {
                    cart.push(productToAdd);
                }
                
                localStorage.setItem('cart', JSON.stringify(cart));
                showNotification(`${currentProduct.name} added to cart!`);
                updateCartBadge();
            } catch (error) {
                console.error('Error adding to cart:', error);
                showNotification('Error adding to cart. Please try again.');
            }
        }

        function showNotification(message) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();
            
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            const badge = document.querySelector('.cart-badge');
            if (badge) {
                badge.textContent = total;
                badge.style.display = total > 0 ? 'flex' : 'none';
            }
        }

        function renderRelatedProducts(products) {
            const grid = document.getElementById('related-grid');
            if (!grid || !currentProduct) return;

            let pool = products.filter(p =>
                (p.category === currentProduct.category || p.brand === currentProduct.brand) &&
                p.id !== currentProduct.id
            );

            if (pool.length === 0) {
                pool = products.filter(p => p.id !== currentProduct.id);
            }

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const relatedProducts = pool.slice(0, 4);

            if (relatedProducts.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:30px;">No related products found</p>';
                return;
            }

            grid.innerHTML = relatedProducts.map(product => `
                <div class="related-product-card">
                    <a href="product.html?id=${product.id}" class="rpc-image">
                        <img src="${product.images?.[0] || 'images/placeholder.png'}" alt="${product.name}" onerror="this.src='images/placeholder.png'">
                    </a>
                    <div class="rpc-content">
                        <div class="rpc-brand">${product.brand}</div>
                        <a href="product.html?id=${product.id}" class="rpc-name">${product.name}</a>
                        <div class="rpc-price">$${product.price.toFixed(2)}</div>
                        <div class="rpc-actions">
                            <button class="cart-btn" onclick="event.preventDefault(); addRelatedToCart('${product.id}')">
                                <i class="fas fa-shopping-cart"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addRelatedToCart(productId) {
            fetch('products.json')
                .then(res => res.json())
                .then(products => {
                    const product = products.find(p => String(p.id) === String(productId));
                    if (product) {
                        let cart = JSON.parse(localStorage.getItem('cart')) || [];
                        const existing = cart.find(item => String(item.id) === String(productId));
                        if (existing) {
                            existing.qty += 1;
                        } else {
                            cart.push({
                                id: product.id,
                                name: product.name,
                                price: product.price,
                                brand: product.brand,
                                image: product.images?.[0] || 'images/placeholder.png',
                                qty: 1
                            });
                        }
                        localStorage.setItem('cart', JSON.stringify(cart));
                        showNotification(`${product.name} added to cart!`);
                        updateCartBadge();
                    }
                });
        }

        // GALLERY FUNCTIONS
        function openGallery(idx) {
            if (!galleryImages || galleryImages.length === 0) return;
            galleryIndex = idx >= 0 && idx < galleryImages.length ? idx : 0;
            const modal = document.getElementById('galleryModal');
            const imgEl = document.getElementById('galleryModalImg');
            if (imgEl) imgEl.src = galleryImages[galleryIndex];
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            const left = modal.querySelector('.arrow.left');
            const right = modal.querySelector('.arrow.right');
            if (galleryImages.length < 2) {
                if (left) left.style.display = 'none';
                if (right) right.style.display = 'none';
            } else {
                if (left) left.style.display = '';
                if (right) right.style.display = '';
            }
            document.addEventListener('keydown', galleryKeyHandler);
        }

        function closeGallery() {
            const modal = document.getElementById('galleryModal');
            if (modal) modal.style.display = 'none';
            document.body.style.overflow = '';
            document.removeEventListener('keydown', galleryKeyHandler);
        }

        function nextGallery() {
            if (galleryImages.length === 0) return;
            galleryIndex = (galleryIndex + 1) % galleryImages.length;
            document.getElementById('galleryModalImg').src = galleryImages[galleryIndex];
        }

        function prevGallery() {
            if (galleryImages.length === 0) return;
            galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
            document.getElementById('galleryModalImg').src = galleryImages[galleryIndex];
        }

        function galleryKeyHandler(e) {
            if (e.key === 'ArrowRight') nextGallery();
            if (e.key === 'ArrowLeft') prevGallery();
            if (e.key === 'Escape') closeGallery();
        }

        // TOUCH SUPPORT
        let touchStartX = 0;
        function handleTouchStart(e) { touchStartX = e.changedTouches[0].screenX; }
        function handleTouchEnd(e) {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (diff > 50) prevGallery();
            if (diff < -50) nextGallery();
        }

        // NAVIGATION
        function toggleMobileMenu() {
            document.querySelector('.hamburger-menu').classList.toggle('active');
            document.querySelector('.nav-dropdown').classList.toggle('active');
        }

        document.querySelectorAll('.nav-dropdown a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.hamburger-menu')?.classList.remove('active');
                document.querySelector('.nav-dropdown')?.classList.remove('active');
            });
        });

        document.addEventListener('click', (e) => {
            const dropdown = document.querySelector('.nav-dropdown');
            const hamburger = document.querySelector('.hamburger-menu');
            if (!dropdown?.classList.contains('active')) return;
            if (dropdown.contains(e.target) || hamburger?.contains(e.target)) return;
            dropdown.classList.remove('active');
            hamburger?.classList.remove('active');
        });

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            loadProduct();
            updateCartBadge();
            
            const modal = document.getElementById('galleryModal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeGallery();
                });
                const img = document.getElementById('galleryModalImg');
                if (img) {
                    img.addEventListener('touchstart', handleTouchStart);
                    img.addEventListener('touchend', handleTouchEnd);
                }
            }
        });

        // Highlight active nav
        document.querySelectorAll('.nav-dropdown a').forEach(link => {
            if (link.href === window.location.href || 
                (window.location.pathname.includes('shop.html') && link.href.includes('shop.html'))) {
                link.classList.add('active');
            }
        });
    </script>
