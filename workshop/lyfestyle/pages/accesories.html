<script>
    const container = document.getElementById('shopProducts');
    const categoryProducts = products.filter(p => p.category === 'speakers');
    categoryProducts.forEach(p=>{
        container.innerHTML += `
        <div class="product-card">
            <img src="${p.img}" alt="${p.name}">
            <h4>${p.name}</h4>
