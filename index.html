<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #0a0a0f;
  font-family: 'Space Grotesk', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  color: #eef5ff;
  position: relative;
}

.gyro-perspective {
  perspective: 1200px;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transform-style: preserve-3d;
}

.hero {
  text-align: center;
  padding: 2rem 1.5rem;
  transform-style: preserve-3d;
  transition: transform 0.1s ease-out;
  will-change: transform;
}

.profile-frame {
  width: 180px;
  height: 180px;
  margin: 0 auto 1.5rem;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 255, 196, 0.3), rgba(0, 100, 255, 0.2));
  padding: 3px;
  backdrop-filter: blur(2px);
  box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,255,200,0.2);
}

#profile-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  background: #111217;
  display: block;
}

#name-text {
  font-size: 2.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #FFFFFF, #88FFF0);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 2px 5px rgba(0,255,200,0.1);
  margin-bottom: 0.5rem;
}

.tagline {
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #88FFF0;
  opacity: 0.85;
  margin-bottom: 1rem;
}

.badge {
  font-size: 0.75rem;
  background: rgba(136, 255, 240, 0.1);
  backdrop-filter: blur(8px);
  display: inline-block;
  padding: 0.4rem 1rem;
  border-radius: 40px;
  border: 1px solid rgba(136, 255, 240, 0.3);
  color: #ccfff8;
}

.slide-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(12, 12, 20, 0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(136, 255, 240, 0.25);
  border-radius: 28px 28px 0 0;
  padding: 1.2rem 1.8rem;
  transform: translateY(100%);
  transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  z-index: 200;
  box-shadow: 0 -15px 35px rgba(0,0,0,0.5);
}

.slide-panel.show {
  transform: translateY(0);
}

.panel-inner {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  max-width: 500px;
  margin: 0 auto;
}

.action-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: rgba(20, 25, 40, 0.6);
  padding: 0.75rem 1.25rem;
  border-radius: 60px;
  transition: all 0.2s ease;
  border: 1px solid rgba(136, 255, 240, 0.2);
}

.action-row:hover {
  border-color: rgba(136, 255, 240, 0.6);
  background: rgba(30, 35, 55, 0.8);
}

.icon-img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  filter: drop-shadow(0 0 3px #88FFF0);
}

.link-area {
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  text-decoration: none;
  color: #f0f3ff;
  font-weight: 500;
  font-size: 1.1rem;
  letter-spacing: 0.3px;
}

.insta-link, .email-link {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-decoration: none;
  color: inherit;
}

.insta-link {
  cursor: pointer;
}

.email-link {
  cursor: pointer;
}

.spelling-text {
  font-weight: 600;
  background: linear-gradient(120deg, #fff, #88FFF0);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  font-size: 1.2rem;
  letter-spacing: 1px;
}

.email-address {
  font-size: 0.95rem;
  font-family: monospace;
  letter-spacing: 0.5px;
  color: #b4e6ff;
  word-break: break-all;
}

.gesture-hint {
  text-align: center;
  font-size: 0.7rem;
  margin-top: 0.6rem;
  opacity: 0.6;
  letter-spacing: 1px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.gesture-hint span {
  font-size: 0.9rem;
}

@media (max-width: 550px) {
  .hero {
    padding: 1rem 1rem;
  }
  .profile-frame {
    width: 140px;
    height: 140px;
  }
  #name-text {
    font-size: 1.9rem;
  }
  .tagline {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
  }
  .action-row {
    padding: 0.6rem 1rem;
  }
  .spelling-text {
    font-size: 1rem;
  }
  .icon-img {
    width: 28px;
    height: 28px;
  }
  .slide-panel {
    padding: 1rem 1.2rem;
  }
}

@keyframes subtleGlow {
  0% { text-shadow: 0 0 0px #88FFF0; }
  100% { text-shadow: 0 0 6px #88FFF0; }
}

.interactive-zone {
  cursor: pointer;
}
</style>
<script src="cdn/javascript/permissionhandler.js"></script>
</head>
<body>

<div class="gyro-perspective" id="gyroScene">
  <div class="hero" id="gyroElement">
    <div class="profile-frame">
      <img src="cdn/assets/me.png" alt="Keyshaun Sookdar" id="profile-img">
    </div>
    <h1 id="name-text">Keyshaun Sookdar</h1>
    <div class="tagline">FULL-STACK ARCHITECT</div>
    <div class="badge">✦ SYSTEM CORE ✦</div>
  </div>
</div>

<div class="slide-panel" id="slidePanel">
  <div class="panel-inner">
    <div class="action-row">
      <a href="https://www.instagram.com/keyshaun.dev/" target="_blank" rel="noopener noreferrer" class="insta-link" id="instaMainLink">
        <img src="cdn/icons/instagram.png" alt="instagram" class="icon-img" onerror="this.src='https://keyshaun.pages.dev/cdn/icons/instagram.png'">
        <span class="spelling-text" id="dynamicInstaText"></span>
      </a>
    </div>
    <div class="action-row">
      <a href="mailto:KSookdar@proton.me" class="email-link">
        <img src="cdn/icons/email.png" alt="email" class="icon-img" onerror="this.src='https://keyshaun.pages.dev/cdn/icons/email.png'">
        <span class="email-address">KSookdar@proton.me</span>
      </a>
    </div>
    <div class="gesture-hint">
      <span>🌀</span> tilt phone → 3D depth <span>🌀</span>
    </div>
  </div>
</div>

<script>
(function() {
  const SPELL_TARGET = "keyshaun.dev";
  const spellContainer = document.getElementById("dynamicInstaText");
  const slidePanel = document.getElementById("slidePanel");
  let spellIndex = 0;
  let spellInterval = null;

  function startSpellingEffect() {
    if (!spellContainer) return;
    spellContainer.textContent = "";
    spellIndex = 0;
    if (spellInterval) clearInterval(spellInterval);
    spellInterval = setInterval(() => {
      if (spellIndex < SPELL_TARGET.length) {
        spellContainer.textContent += SPELL_TARGET.charAt(spellIndex);
        spellIndex++;
      } else {
        clearInterval(spellInterval);
        spellInterval = null;
      }
    }, 85);
  }

  function triggerSlideAndSpell() {
    if (slidePanel) {
      slidePanel.classList.add("show");
    }
    startSpellingEffect();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(triggerSlideAndSpell, 180);
    });
  } else {
    setTimeout(triggerSlideAndSpell, 180);
  }

  const instaLinkBlock = document.getElementById("instaMainLink");
  if (instaLinkBlock) {
    instaLinkBlock.addEventListener("click", (e) => {
      const href = instaLinkBlock.getAttribute("href");
      if (href && href.startsWith("http")) {
        window.open(href, "_blank", "noopener noreferrer");
        e.preventDefault();
      }
    });
  }

  const emailLink = document.querySelector(".email-link");
  if (emailLink) {
    emailLink.addEventListener("click", (e) => {
      e.stopPropagation();
    });
  }

  function sendPermissionBridge() {
    try {
      if (window.localStorage) {
        const permRecord = {
          timestamp: Date.now(),
          gyroEnabled: true,
          visualAccess: "granted",
          source: "index_ks"
        };
        localStorage.setItem("ks_permission_sync", JSON.stringify(permRecord));
        if (window.sessionStorage) {
          sessionStorage.setItem("ks_ui_permission", "home_ready");
        }
      }
      if (window.dispatchEvent) {
        const permEvent = new CustomEvent("keyshaunPermData", {
          detail: { status: "active", environment: "fullstack_portal" }
        });
        window.dispatchEvent(permEvent);
      }
    } catch(e) {}
  }
  sendPermissionBridge();

  let gyroActive = false;
  let currentRotX = 0;
  let currentRotY = 0;
  let targetRotX = 0;
  let targetRotY = 0;
  const gyroElement = document.getElementById("gyroElement");
  const gyroScene = document.getElementById("gyroScene");
  let animationFrame = null;
  let initialGamma = null;
  let initialBeta = null;
  let calibrationDone = false;

  function lerp(start, end, factor) {
    return start + (end - start) * factor;
  }

  function updateGyroTransform() {
    if (!gyroElement) return;
    currentRotX = lerp(currentRotX, targetRotX, 0.15);
    currentRotY = lerp(currentRotY, targetRotY, 0.15);
    const limitedX = Math.min(14, Math.max(-14, currentRotX));
    const limitedY = Math.min(12, Math.max(-12, currentRotY));
    gyroElement.style.transform = `rotateX(${limitedX}deg) rotateY(${limitedY}deg) translateZ(4px)`;
    animationFrame = requestAnimationFrame(updateGyroTransform);
  }

  function handleOrientation(event) {
    if (!gyroActive) return;
    let beta = event.beta;
    let gamma = event.gamma;
    if (beta === null || gamma === null) return;
    if (!calibrationDone && (initialBeta === null || initialGamma === null)) {
      initialBeta = beta;
      initialGamma = gamma;
      calibrationDone = true;
      return;
    }
    let relBeta = beta - (initialBeta || 0);
    let relGamma = gamma - (initialGamma || 0);
    let rawX = -relBeta * 0.55;
    let rawY = relGamma * 0.55;
    rawX = Math.min(12, Math.max(-12, rawX));
    rawY = Math.min(12, Math.max(-12, rawY));
    targetRotX = rawX;
    targetRotY = rawY;
  }

  function initGyroEffect() {
    if (gyroActive) return;
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      const gestureZone = document.body;
      const requestPermissionWrapper = function() {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === "granted") {
              window.addEventListener("deviceorientation", handleOrientation);
              gyroActive = true;
              calibrationDone = false;
              initialBeta = null;
              initialGamma = null;
              animationFrame = requestAnimationFrame(updateGyroTransform);
            }
          })
          .catch(err => console.warn("gyro permission denied", err));
        gestureZone.removeEventListener("touchstart", requestPermissionWrapper);
        gestureZone.removeEventListener("click", requestPermissionWrapper);
      };
      document.body.addEventListener("touchstart", requestPermissionWrapper, { once: true });
      document.body.addEventListener("click", requestPermissionWrapper, { once: true });
      const hintMsg = document.querySelector(".gesture-hint");
      if (hintMsg) {
        hintMsg.style.opacity = "1";
      }
    } else {
      window.addEventListener("deviceorientation", handleOrientation);
      gyroActive = true;
      calibrationDone = false;
      initialBeta = null;
      initialGamma = null;
      animationFrame = requestAnimationFrame(updateGyroTransform);
    }
  }

  function safeGyroStart() {
    if (gyroActive) return;
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      const startFn = function(e) {
        DeviceOrientationEvent.requestPermission()
          .then(perm => {
            if (perm === "granted") {
              window.addEventListener("deviceorientation", handleOrientation);
              gyroActive = true;
              calibrationDone = false;
              initialBeta = null;
              initialGamma = null;
              animationFrame = requestAnimationFrame(updateGyroTransform);
            }
          })
          .catch(() => {});
        document.body.removeEventListener("click", startFn);
        document.body.removeEventListener("touchstart", startFn);
      };
      document.body.addEventListener("click", startFn);
      document.body.addEventListener("touchstart", startFn);
    } else {
      window.addEventListener("deviceorientation", handleOrientation);
      gyroActive = true;
      animationFrame = requestAnimationFrame(updateGyroTransform);
    }
  }

  setTimeout(() => {
    initGyroEffect();
  }, 400);

  window.addEventListener("load", () => {
    const styleCheck = document.createElement("style");
    if (!document.querySelector('style[data-dynamic]')) {
      const mobileFix = document.createElement("style");
      mobileFix.textContent = `.slide-panel { transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1); }`;
      document.head.appendChild(mobileFix);
    }
    const images = document.querySelectorAll('.icon-img');
    images.forEach(img => {
      img.addEventListener('error', function() {
        if (!this.src.includes('fallback')) {
          if (this.alt === 'instagram') this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2388FFF0"%3E%3Cpath d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.334 3.608 1.308.975.975 1.246 2.242 1.308 3.608.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.062 1.366-.334 2.633-1.308 3.608-.975.975-2.242 1.246-3.608 1.308-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.366-.062-2.633-.334-3.608-1.308-.975-.975-1.246-2.242-1.308-3.608-.058-1.266-.07-1.646-.07-4.85s.012-3.584.07-4.85c.062-1.366.334-2.633 1.308-3.608.975-.975 2.242-1.246 3.608-1.308 1.266-.058 1.646-.07 4.85-.07zM12 0C8.741 0 8.333.014 7.053.072 5.41.145 4.206.48 3.172 1.514 2.138 2.548 1.803 3.752 1.73 5.396 1.672 6.676 1.658 7.084 1.658 10.34s.014 3.664.072 4.944c.073 1.644.408 2.848 1.442 3.882 1.034 1.034 2.238 1.369 3.882 1.442 1.28.058 1.688.072 4.944.072s3.664-.014 4.944-.072c1.644-.073 2.848-.408 3.882-1.442 1.034-1.034 1.369-2.238 1.442-3.882.058-1.28.072-1.688.072-4.944s-.014-3.664-.072-4.944c-.073-1.644-.408-2.848-1.442-3.882-1.034-1.034-2.238-1.369-3.882-1.442C15.667.014 15.259 0 12 0z"/%3E%3Ccircle cx="12" cy="12" r="3.2"/%3E%3C/svg%3E';
          else if (this.alt === 'email') this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2388FFF0"%3E%3Cpath d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/%3E%3C/svg%3E';
        }
      });
    });
  });

  const gyroHint = document.querySelector(".gesture-hint");
  if (gyroHint) {
    gyroHint.addEventListener("click", (e) => {
      e.stopPropagation();
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission()
          .then(perm => {
            if (perm === "granted") {
              if (!gyroActive) {
                window.addEventListener("deviceorientation", handleOrientation);
                gyroActive = true;
                calibrationDone = false;
                initialBeta = null;
                initialGamma = null;
                animationFrame = requestAnimationFrame(updateGyroTransform);
              }
            }
          })
          .catch(() => {});
      }
    });
  }

  window.addEventListener("pageshow", () => {
    if (slidePanel && !slidePanel.classList.contains("show")) {
      slidePanel.classList.add("show");
    }
    if (!spellContainer || (spellContainer.textContent.length !== SPELL_TARGET.length && !spellInterval)) {
      if (spellContainer) {
        if (spellContainer.textContent.length === 0) startSpellingEffect();
        else if (spellContainer.textContent !== SPELL_TARGET) {
          if (spellInterval) clearInterval(spellInterval);
          spellContainer.textContent = "";
          spellIndex = 0;
          startSpellingEffect();
        }
      }
    }
    sendPermissionBridge();
  });
})();
</script>

<noscript>
  <style>.slide-panel { transform: translateY(0); } .spelling-text:after { content: "keyshaun.dev"; }</style>
</noscript>
</body>
</html>
