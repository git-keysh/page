<style>
.bottom-social{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;

    display:flex;
    align-items:center;
    gap:12px;

    padding:10px 18px;

    border-radius:999px;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);

    text-decoration:none;

    font-family:'Poppins',sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:.4px;

    color:#fff;

    transition:.35s ease;

    animation:floaty 3s ease-in-out infinite;
}

.bottom-social:hover{
    transform:translateX(-50%) scale(1.06);
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 25px rgba(255,255,255,0.12);
}

.bottom-social img{
    width:28px;
    height:28px;
    object-fit:cover;

    border-radius:10px;

    transition:.35s ease;
}

.bottom-social:hover img{
    transform:rotate(-8deg) scale(1.12);
}

.bottom-social span{
    position:relative;
}

.bottom-social span::after{
    content:'';
    position:absolute;
    left:0;
    bottom:-3px;

    width:0%;
    height:2px;

    border-radius:20px;
    background:#fff;

    transition:.35s ease;
}

.bottom-social:hover span::after{
    width:100%;
}

@keyframes floaty{
    0%{
        transform:translateX(-50%) translateY(0px);
    }
    50%{
        transform:translateX(-50%) translateY(-5px);
    }
    100%{
        transform:translateX(-50%) translateY(0px);
    }
}
</style>
